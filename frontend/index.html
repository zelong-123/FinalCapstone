<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Franchise Titan enterprise franchise operations platform" />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon.png.png" />
    <title>Franchise Titan</title>
    <script>
      (() => {
        const stored = localStorage.getItem('herald_theme');
        const theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
      <script src="/app/live-sync.js" defer></script>
  </body>
</html>
