openapi: 3.1.0
info:
  title: Franchise Titan Backend API
  version: 1.0.0
  description: API-only backend for franchise inquiries, applicants, schedules, inventory, supply fulfillment, analytics, and forecasting.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local XAMPP testing
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Inquiries
  - name: Applicants
  - name: Activities
  - name: Inventory
  - name: Supply Requests
  - name: Analytics
  - name: Forecasting
paths:
  /health:
    get:
      tags: [System]
      security: []
      summary: Check API and database health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Exchange credentials for an opaque bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          token_type: { type: string, const: Bearer }
                          expires_in_minutes: { type: [integer, 'null'] }
                          user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user and linked applicant/franchisee data
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current token
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /auth/password:
    put:
      tags: [Authentication]
      summary: Change password and revoke other tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inquiries:
    get:
      tags: [Inquiries]
      summary: List franchise inquiries
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InquiryStatus' } }
        - { name: source, in: query, schema: { type: string } }
        - { name: brand_id, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Inquiries]
      summary: Record an inquiry (marketing/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InquiryInput'
      responses:
        '201':
          description: Inquiry created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Inquiry' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inquiries/{inquiry}:
    parameters:
      - { name: inquiry, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Inquiries]
      summary: Get inquiry detail
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Inquiries]
      summary: Update an inquiry (marketing/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InquiryInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inquiries/{inquiry}/endorse:
    post:
      tags: [Inquiries]
      summary: Endorse inquiry to a sales/admin user
      parameters:
        - { name: inquiry, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endorsed_to_user_id]
              properties:
                endorsed_to_user_id: { type: integer }
                remarks: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /inquiries/{inquiry}/convert:
    post:
      tags: [Inquiries]
      summary: Convert an inquiry to an applicant (sales/admin)
      parameters:
        - { name: inquiry, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: [string, 'null'] }
                application_date: { type: string, format: date }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /applicants:
    get:
      tags: [Applicants]
      summary: List applicants visible to the current role
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ApplicantStatus' } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Applicants]
      summary: Create an applicant directly (sales/admin)
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /applicants/{applicant}:
    parameters:
      - { name: applicant, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Applicants]
      summary: Get applicant, status timeline, activities, payments, documents, and franchisee
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Applicants]
      summary: Update applicant data (sales/admin)
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /applicants/{applicant}/status:
    patch:
      tags: [Applicants]
      summary: Update application status and append history
      parameters:
        - { name: applicant, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ApplicantStatus' }
                remarks: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /applicants/{applicant}/loi:
    post:
      tags: [Applicants]
      summary: Upload Letter of Intent
      parameters:
        - { name: applicant, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                submission_date: { type: string, format: date }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /applicants/{applicant}/payments:
    post:
      tags: [Applicants]
      summary: Record a manual payment status
      parameters:
        - { name: applicant, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /applicants/{applicant}/approve:
    post:
      tags: [Applicants]
      summary: Approve applicant and create franchisee record (admin)
      parameters:
        - { name: applicant, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /activities:
    get:
      tags: [Activities]
      summary: List scheduled activities
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Activities]
      summary: Schedule an activity with conflict validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInput'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /activities/{activity}:
    parameters:
      - { name: activity, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Activities]
      summary: Get an activity
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Activities]
      summary: Reschedule or edit an activity
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Activities]
      summary: Cancel an activity
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /activities/{activity}/complete:
    post:
      tags: [Activities]
      summary: Record completed/no-show result
      parameters:
        - { name: activity, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /inventories:
    get:
      tags: [Inventory]
      summary: List inventory with derived stock status
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Inventory]
      summary: Create a location-product inventory record (admin/logistics)
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /inventories/{inventory}/adjust:
    post:
      tags: [Inventory]
      summary: Apply an inventory adjustment and transaction record
      parameters:
        - { name: inventory, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, type]
              properties:
                quantity: { type: number, description: Positive or negative adjustment }
                type: { $ref: '#/components/schemas/InventoryTransactionType' }
                remarks: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supply-requests:
    get:
      tags: [Supply Requests]
      summary: List supply requests scoped to the current user/role
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
    post:
      tags: [Supply Requests]
      summary: Create a supply request (franchisee/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequestInput'
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supply-requests/{supplyRequest}:
    parameters:
      - { name: supplyRequest, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Supply Requests]
      summary: Get request, items, delivery, and status timeline
      responses:
        '200': { $ref: '#/components/responses/Success' }
    put:
      tags: [Supply Requests]
      summary: Edit a draft supply request
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /supply-requests/{supplyRequest}/availability:
    get:
      tags: [Supply Requests]
      summary: Check active warehouse availability for every requested item
      parameters:
        - { name: supplyRequest, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supply-requests/{supplyRequest}/status:
    patch:
      tags: [Supply Requests]
      summary: Apply a role-checked workflow transition
      parameters:
        - { name: supplyRequest, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/SupplyRequestStatus' }
                remarks: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /supply-requests/{supplyRequest}/pod:
    post:
      tags: [Supply Requests]
      summary: Upload proof of delivery (logistics)
      parameters:
        - { name: supplyRequest, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                recipient_name: { type: string }
                notes: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /analytics/overview:
    get:
      tags: [Analytics]
      summary: KPI and trend dashboard data
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /analytics/inventory-movement:
    get:
      tags: [Analytics]
      summary: Daily inventory inbound/outbound series
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /forecasts:
    get:
      tags: [Forecasting]
      summary: List generated forecasts
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
  /inventories/{inventory}/forecast:
    post:
      tags: [Forecasting]
      summary: Generate a Simple Moving Average forecast for one inventory item
      parameters:
        - { name: inventory, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                periods: { type: integer, minimum: 2, maximum: 24, default: 3 }
      responses:
        '201': { $ref: '#/components/responses/Success' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaqueToken
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Paginated:
      description: Paginated successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaginatedEnvelope' }
    Unauthenticated:
      description: Token is missing, invalid, or expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated role cannot perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation or workflow rule failed
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
  schemas:
    Envelope:
      type: object
      properties:
        message: { type: string }
        data: {}
    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: { type: array, items: {} }
            meta:
              type: object
              properties:
                current_page: { type: integer }
                last_page: { type: integer }
                per_page: { type: integer }
                total: { type: integer }
            links:
              type: object
              additionalProperties: { type: [string, 'null'] }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    RoleName:
      type: string
      enum: [marketing, sales, admin, logistics, franchisee]
    InquiryStatus:
      type: string
      enum: [new, contacted, endorsed, converted, closed]
    ApplicantStatus:
      type: string
      enum: [inquiry, qualified, scheduled, loi_submitted, payment_submitted, for_approval, approved, rejected, active_franchisee]
    ActivityType:
      type: string
      enum: [orientation, product_tasting, training, other]
    ActivityStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled, no_show]
    SupplyRequestStatus:
      type: string
      enum: [draft, submitted, under_review, endorsed, preparing, dispatched, delivered, completed, rejected, cancelled]
    InventoryTransactionType:
      type: string
      enum: [opening, adjustment_in, adjustment_out, consumption, fulfillment, replenishment]
    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        account_status: { type: string }
        role:
          type: object
          properties:
            id: { type: integer }
            name: { $ref: '#/components/schemas/RoleName' }
            label: { type: string }
    Inquiry:
      type: object
      properties:
        id: { type: integer }
        lead_name: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        source: { type: string }
        preferred_brand_id: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        remarks: { type: [string, 'null'] }
        inquiry_date: { type: string, format: date }
    InquiryInput:
      type: object
      required: [lead_name, source]
      properties:
        lead_name: { type: string, maxLength: 255 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        source: { type: string, enum: [facebook, viber, gmail, walk_in, referral, other] }
        preferred_brand_id: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/InquiryStatus' }
        remarks: { type: [string, 'null'] }
        inquiry_date: { type: string, format: date }
    ActivityInput:
      type: object
      required: [applicant_id, activity_type, title, starts_at, ends_at]
      properties:
        applicant_id: { type: integer }
        activity_type: { $ref: '#/components/schemas/ActivityType' }
        title: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        venue: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ActivityStatus' }
        assigned_to_user_id: { type: [integer, 'null'] }
        participants:
          type: array
          items: { type: string }
    SupplyRequestInput:
      type: object
      required: [location_id, delivery_address, items]
      properties:
        location_id: { type: integer }
        submit: { type: boolean, default: true }
        target_delivery_date: { type: [string, 'null'], format: date }
        delivery_address: { type: string }
        remarks: { type: [string, 'null'] }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, quantity_requested]
            properties:
              product_id: { type: integer }
              quantity_requested: { type: integer, minimum: 1 }
